<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Archie Lite</title>
<link rel="icon" type="image/png" href="/icon.png">
<link rel="stylesheet" href="/style.css">
<script>window.LITE_TOKEN = "__TOKEN__";</script>
</head>
<body>
<div class="panel" role="main">
  <header>
    <div class="row">
      <div class="brand"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4l3 3h8l3-3v9a7 7 0 0 1-14 0z"/><circle cx="9" cy="11" r="1.6"/><circle cx="15" cy="11" r="1.6"/><path d="M11 14.5l1 1 1-1"/></svg><span>ARCHIE <b>LITE</b></span></div>
      <div class="actions">
        <button class="icon" id="owlbtn" aria-label="Show or hide the desktop owl (Ctrl+Alt+O)" title="Show / hide the desktop owl (Ctrl+Alt+O)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4l3 3h8l3-3v9a7 7 0 0 1-14 0z"/><circle cx="9" cy="11" r="1.6"/><circle cx="15" cy="11" r="1.6"/></svg></button>
        <button class="icon" id="syncbtn" aria-label="Sync now" title="Sync now"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
        <button class="icon" id="hide" aria-label="Hide Archie Lite (Ctrl+Alt+A)" title="Hide (Ctrl+Alt+A)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"/></svg></button>
      </div>
    </div>
    <div class="sync" id="sync"><span class="dot"></span><span id="synctext">starting…</span></div>
    <button class="recbar" id="recbar" hidden><span class="rdot"></span><span id="rectext">recording</span><span class="rstop">stop</span></button>
  </header>
  <nav role="tablist" id="tabs">
    <button role="tab" data-tab="today" aria-selected="true">Today</button>
    <button role="tab" data-tab="cal">Calendar</button>
    <button role="tab" data-tab="todo">To-do</button>
    <button role="tab" data-tab="notes">Notes</button>
    <button role="tab" data-tab="saved">Saved</button>
    <button role="tab" data-tab="news">News</button>
    <button role="tab" data-tab="chat">Chat</button>
  </nav>
  <section id="body" aria-live="polite"></section>
  <div class="flash" id="flash" role="status" hidden></div>
  <div class="dropover" id="dropover" hidden><div>Drop to keep it and send it to Obsidian<span>files · links · text</span></div></div>
  <footer>
    <label class="ask"><span class="sr">Ask Archie</span><input id="ask" placeholder="Ask Archie…" autocomplete="off"></label>
    <button class="send" id="send" aria-label="Send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M13 6l6 6-6 6"/></svg></button>
  </footer>
</div>
<script src="/app.js"></script>
</body></html>
