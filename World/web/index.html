<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archie World</title>
<link rel="icon" href="/web/data/icon.png">
<style>
@font-face { font-family: "Geist"; src: url(/fonts/Geist-Regular.ttf); font-weight: 400; }
@font-face { font-family: "Geist"; src: url(/fonts/Geist-SemiBold.ttf); font-weight: 500 600; }
@font-face { font-family: "Geist"; src: url(/fonts/Geist-Bold.ttf); font-weight: 700 800; }
@font-face { font-family: "JetBrains Mono"; src: url(/fonts/JetBrainsMono-Regular.ttf); font-weight: 400 500; }
@font-face { font-family: "JetBrains Mono"; src: url(/fonts/JetBrainsMono-Bold.ttf); font-weight: 700; }
/* A situation room: the globe fills the screen, slim glass panels float over it.
   One deliberate look, Archie's black and lime, dark only. */
:root {
  color-scheme: dark;
  --bg: #04060a;
  --glass: rgba(8, 10, 9, .84);
  --line: #22261f;
  --fg: #e8e8e3;
  --muted: #8f918a;
  --dim: #5d5f59;
  --lime: #c6f432;
  --up: #c6f432;
  --down: #ff6b5e;
  --left: #60a5fa;
  --center: #a3a3a3;
  --right: #ff8a4c;
  --war: #ff3b30;
  --armed: #ff8a4c;
  --unrest: #f5c542;
  --quake: #f5a524;
  --fire: #ff5f57;
  --choke: #2dd4bf;
  --oil: #d9a066;
  --gas: #67e8f9;
  --sat: #c084fc;
  --cyclone: #38bdf8;
  --flood: #3b82f6;
  --volcano: #ff3b30;
  --t-politics: #e8e8e3;
  --t-conflict: #ff5f57;
  --t-economy: #c6f432;
  --t-science: #c084fc;
  --t-climate: #f5a524;
  --t-health: #2dd4bf;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --body: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  --lw: 188px;
  --rw: 280px;
}
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); overflow: hidden; font-size: 12px; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }

/* top bar */
.top { position: fixed; inset: 0 0 auto 0; height: 38px; z-index: 30; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: rgba(4,6,5,.9); border-bottom: 1px solid var(--line); }
.brand { font-family: var(--mono); font-weight: 700; letter-spacing: .1em; font-size: 12px; }
.brand b { color: var(--lime); }
.stamp { font-family: var(--mono); font-size: 10px; color: var(--muted); white-space: nowrap; }
.stamp b { color: var(--lime); font-weight: 400; animation: blink 1.4s steps(2) infinite; }
.example { font-family: var(--mono); font-size: 9px; color: #0a0a0a; background: var(--quake); padding: 2px 6px; border-radius: 3px; letter-spacing: .06em; white-space: nowrap; }
.spacer { flex: 1; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex: none; }
.seg button { background: none; border: 0; padding: 4px 10px; font-family: var(--mono); font-size: 10px; color: var(--muted); white-space: nowrap; }
.seg button[aria-pressed="true"] { background: #1a1f14; color: var(--lime); }
.tbtn { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-family: var(--mono); font-size: 10px; color: var(--muted); white-space: nowrap; }
.tbtn[aria-pressed="true"] { color: var(--fg); }
.clock { font-family: var(--mono); font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* stage */
.stage { position: fixed; inset: 38px 0 24px 0; overflow: hidden; background: radial-gradient(ellipse at 50% 45%, #0b1220 0%, #04060a 70%); }
#globe, #map { position: absolute; inset: 0; }
#map { width: 100%; height: 100%; display: block; cursor: grab; }
#map:active { cursor: grabbing; }

/* stat strip */
.stats { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 5; pointer-events: none; }
.stat { font-family: var(--mono); font-size: 9.5px; color: var(--muted); background: var(--glass); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; white-space: nowrap; backdrop-filter: blur(6px); }
.stat b { font-weight: 700; margin-right: 5px; font-variant-numeric: tabular-nums; }

/* floating panes */
.pane { position: fixed; top: 48px; bottom: 34px; z-index: 20; background: var(--glass); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(10px); display: flex; flex-direction: column; overflow: hidden; transition: transform .25s ease; }
.pane.left { left: 10px; width: var(--lw); }
.pane.right { right: 10px; width: var(--rw); }
.pane.left.closed { transform: translateX(calc(-100% - 14px)); }
.pane.right.closed { transform: translateX(calc(100% + 14px)); }
.ph { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex: none; }
.h { font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; }
.pb { overflow-y: auto; padding: 6px 8px 10px; flex: 1; min-height: 0; scrollbar-width: thin; scrollbar-color: #2a2e25 transparent; }
.grp-h { font-family: var(--mono); font-size: 9px; color: var(--dim); letter-spacing: .12em; text-transform: uppercase; margin: 10px 2px 3px; }
.layer { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; align-items: center; gap: 7px; background: none; border: 0; padding: 3px 4px; text-align: left; border-radius: 5px; width: 100%; font-size: 11px; }
.layer:hover { background: #151812; }
.layer span:nth-child(2) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sw { width: 9px; height: 9px; border-radius: 2px; }
.sw.line { height: 3px; border-radius: 2px; }
.layer .n { font-family: var(--mono); font-size: 9px; color: var(--dim); font-variant-numeric: tabular-nums; }
.layer[aria-pressed="false"] { color: var(--dim); }
.layer[aria-pressed="false"] .sw { background: transparent !important; outline: 1px solid var(--dim); }
.note { font-size: 10px; color: var(--dim); line-height: 1.45; margin: 10px 2px 0; }
.chips { display: flex; gap: 4px; flex-wrap: wrap; margin: 2px; }
.chip { background: none; border: 1px solid var(--line); border-radius: 999px; padding: 2px 7px; font-family: var(--mono); font-size: 9px; color: var(--muted); }
.chip[aria-pressed="true"] { color: var(--lime); border-color: var(--lime); }

/* tabs */
.tabs { display: flex; flex: none; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; background: none; border: 0; border-bottom: 2px solid transparent; padding: 8px 0 6px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--lime); }
.tabs button .ct { color: var(--dim); margin-left: 3px; }
.tabs button.warTab[aria-selected="true"] { border-bottom-color: var(--war); }
@keyframes blink { 50% { opacity: .2; } }
.livebar { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 9px; color: var(--muted); padding: 7px 2px 4px; }
.livebar b { color: var(--war); font-weight: 400; animation: blink 1.4s steps(2) infinite; }

/* conflict feed */
.cf { display: grid; grid-template-columns: 3px minmax(0, 1fr); gap: 8px; background: none; border: 0; border-bottom: 1px solid #16190f; padding: 7px 2px; text-align: left; width: 100%; }
.cf:hover { background: #12150e; }
.cf .sev { border-radius: 2px; }
.cf .meta { display: flex; gap: 6px; align-items: center; font-family: var(--mono); font-size: 9px; color: var(--muted); }
.cf .zone { color: var(--fg); letter-spacing: .04em; }
.cf .tx { font-size: 11.5px; line-height: 1.35; margin: 2px 0 4px; }
.src { display: inline-block; font-family: var(--mono); font-size: 8.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; margin-right: 3px; }
.new { animation: flash 3s ease-out; }
@keyframes flash { from { background: #2a1512; } to { background: transparent; } }

/* news feed */
.story { display: grid; grid-template-columns: 3px minmax(0, 1fr); gap: 8px; background: none; border: 0; border-bottom: 1px solid #16190f; padding: 6px 2px; text-align: left; width: 100%; }
.story:hover { background: #12150e; }
.story .bar { border-radius: 2px; }
.story .t { font-size: 11.5px; line-height: 1.35; }
.story .m { font-family: var(--mono); font-size: 9px; color: var(--muted); margin-top: 3px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.minicov { display: inline-flex; width: 30px; height: 3px; border-radius: 2px; overflow: hidden; background: #1a1d16; }
.minicov span:nth-child(1), .cov span:nth-child(1) { background: var(--left); }
.minicov span:nth-child(2), .cov span:nth-child(2) { background: var(--center); }
.minicov span:nth-child(3), .cov span:nth-child(3) { background: var(--right); }
.onesided { color: var(--quake); }

/* markets */
.mq { display: grid; grid-template-columns: minmax(0, 1fr) 62px 52px; gap: 6px; align-items: center; padding: 4px 2px 0; }
.mq .nm { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mq .px { font-family: var(--mono); font-size: 10px; text-align: right; font-variant-numeric: tabular-nums; }
.mq .ch { font-family: var(--mono); font-size: 9.5px; text-align: right; font-variant-numeric: tabular-nums; }
.mq .spark { grid-column: 1 / -1; width: 100%; height: 16px; display: block; }
.up { color: var(--up); } .dn { color: var(--down); }
.meter { grid-column: 1 / -1; height: 3px; background: #1a1d16; border-radius: 2px; display: flex; }
.meter span { background: var(--center); border-radius: 2px; }
.pq { display: grid; grid-template-columns: minmax(0, 1fr) 36px; gap: 6px; align-items: center; padding: 4px 2px 0; font-size: 11px; }
.pq .px { font-family: var(--mono); font-size: 10px; text-align: right; }

/* country view */
.cv-top { display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-bottom: 1px solid var(--line); flex: none; }
.back { background: none; border: 1px solid var(--line); border-radius: 5px; font-family: var(--mono); font-size: 10px; color: var(--muted); padding: 2px 7px; }
.cv-name { font-size: 16px; font-weight: 600; line-height: 1.2; }
.lvl { font-family: var(--mono); font-size: 9px; padding: 1px 6px; border-radius: 3px; color: #0a0a0a; letter-spacing: .05em; }
.facts { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 3px 8px; font-size: 11px; margin: 6px 2px 4px; }
.facts dt { font-family: var(--mono); font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: .08em; padding-top: 2px; }
.facts dd { margin: 0; }
.nb { background: none; border: 0; padding: 0; color: var(--lime); font-size: 11px; }
.art { display: block; padding: 6px 2px; border-bottom: 1px solid #16190f; }
.art .t { font-size: 11.5px; line-height: 1.35; }
.art .m { font-family: var(--mono); font-size: 9px; color: var(--muted); margin-top: 2px; }
.art .m a { color: var(--lime); text-decoration: none; }
.ph2 { color: var(--muted); }
.row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.btn { background: #151812; border: 1px solid var(--line); border-radius: 5px; padding: 5px 9px; font-family: var(--mono); font-size: 10px; }
.btn.primary { background: var(--lime); color: #0a0a0a; border-color: var(--lime); font-weight: 700; }

/* detail card */
.card { position: fixed; top: 84px; right: calc(var(--rw) + 22px); z-index: 25; width: 300px; background: rgba(8,10,9,.94); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; backdrop-filter: blur(8px); }
body.r-closed .card { right: 16px; }
.card .kind { font-family: var(--mono); font-size: 9px; letter-spacing: .1em; }
.card h3 { margin: 0; font-size: 14.5px; line-height: 1.3; text-wrap: balance; padding-right: 18px; }
.card p { margin: 0; font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.card .srcs { display: flex; flex-direction: column; gap: 3px; }
.card .srow { display: flex; justify-content: space-between; gap: 8px; font-family: var(--mono); font-size: 10px; color: var(--muted); border-top: 1px solid #16190f; padding-top: 4px; }
.card .srow a { color: var(--lime); text-decoration: none; }
.cov { display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: #1a1d16; }
.covtxt { font-family: var(--mono); font-size: 9.5px; color: var(--muted); }
.x { position: absolute; right: 6px; top: 4px; background: none; border: 0; color: var(--muted); font-size: 15px; padding: 2px 6px; }

/* legend + toast */
.legend { position: absolute; left: calc(var(--lw) + 22px); bottom: 10px; display: flex; gap: 10px; flex-wrap: wrap; font-family: var(--mono); font-size: 8.5px; color: var(--muted); pointer-events: none; max-width: 52%; }
body.l-closed .legend { left: 14px; }
.legend i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
.toast { position: absolute; left: 50%; bottom: 58px; transform: translateX(-50%); z-index: 6; background: var(--glass); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 11px; display: flex; gap: 8px; align-items: center; max-width: 46%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: opacity .4s; }
.toast .k { font-family: var(--mono); font-size: 9px; letter-spacing: .08em; }

/* bottom tape */
.tape { position: fixed; inset: auto 0 0 0; height: 24px; z-index: 30; overflow: hidden; white-space: nowrap; background: rgba(4,6,5,.95); border-top: 1px solid var(--line); }
.tape-inner { display: inline-flex; gap: 24px; padding: 5px 12px; animation: tape 90s linear infinite; }
@keyframes tape { to { transform: translateX(-50%); } }
.tk { font-family: var(--mono); font-size: 10px; font-variant-numeric: tabular-nums; }
.tk b { font-weight: 500; color: var(--muted); margin-right: 5px; }
.tip { position: fixed; pointer-events: none; background: #11140e; border: 1px solid var(--line); border-radius: 5px; padding: 4px 7px; font-family: var(--mono); font-size: 10px; color: var(--fg); z-index: 40; }

/* markers placed on the globe (DOM) */
.gm { all: unset; cursor: pointer; pointer-events: auto; font-family: var(--mono); white-space: nowrap; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 4px; }
.gm.choke { font-size: 9px; color: var(--choke); text-shadow: 0 0 4px #000, 0 0 2px #000; }
.gm.choke i { width: 7px; height: 7px; background: var(--choke); transform: rotate(45deg); box-shadow: 0 0 6px var(--choke); flex: none; }
.gm.choke.minor i { width: 5px; height: 5px; opacity: .8; }
.gm.hot { position: relative; transform: translate(-50%, -60%); }
.gm.hot svg { width: 15px; height: 14px; filter: drop-shadow(0 0 5px currentColor); }
.gm.hot::after { content: ""; position: absolute; left: 50%; top: 58%; width: 26px; height: 26px; margin: -13px 0 0 -13px; border-radius: 50%; border: 1px solid currentColor; animation: ping 2s ease-out infinite; }
@keyframes ping { from { transform: scale(.3); opacity: .9; } to { transform: scale(1.6); opacity: 0; } }
.gm.fl { font-size: 8.5px; color: var(--war); letter-spacing: .08em; text-shadow: 0 0 4px #000; pointer-events: none; }
.gm.ex { font-size: 9px; padding: 1px 5px; border-radius: 3px; background: rgba(6,8,5,.82); border: 1px solid; transform: translate(-50%, -140%); }
.gm.volc { font-size: 13px; color: var(--volcano); text-shadow: 0 0 8px var(--volcano); }
.gm.cyc { font-size: 9.5px; font-family: var(--mono); color: var(--cyclone); text-shadow: 0 0 4px #000, 0 0 2px #000; }
.gm.cyc svg { filter: drop-shadow(0 0 4px rgba(0,0,0,.9)); flex: none; }
.gm.iss { font-size: 9px; font-family: var(--mono); color: #d9a441; text-shadow: 0 0 4px #000; }
.gm.iss svg { filter: drop-shadow(0 0 5px rgba(217,164,65,.55)); flex: none; }
.gm.mine, .gm.stn { font-size: 9px; font-family: var(--mono); color: #e8d5b0; text-shadow: 0 0 4px #000, 0 0 2px #000; }
.gm.stn { color: #9ec5ff; }
.gm.stn.sum svg { opacity: .7; }
.gm.mine svg, .gm.stn svg { flex: none; filter: drop-shadow(0 0 3px rgba(0,0,0,.9)); }
.facts.own { margin: 2px 0 0; }
.sf { display: flex; flex-direction: column; gap: 3px; }
.sf-row { display: grid; grid-template-columns: 8px 118px 92px minmax(0, 1fr); gap: 6px; align-items: baseline; font-size: 11px; padding: 2px 0; border-bottom: 1px solid #16190f; }
.sf-row i { width: 7px; height: 7px; border-radius: 50%; align-self: center; }
.sf-t { font-family: var(--mono); font-size: 9.5px; color: var(--muted); }
.sf-w { font-family: var(--mono); font-size: 10px; color: var(--fg); }
.sf-p { color: #c9cbc4; }
@keyframes spin { to { transform: translate(-50%, -50%) rotate(-360deg); } }
.float-tooltip-kap { background: #11140e !important; border: 1px solid var(--line); border-radius: 5px !important; font-family: var(--mono) !important; font-size: 10px !important; color: var(--fg) !important; padding: 4px 7px !important; }

/* 2D map (SVG) */
#map .ctry { vector-effect: non-scaling-stroke; stroke: rgba(198,244,50,.28); stroke-width: .6; cursor: pointer; }
#map .ctry:hover { fill: rgba(198,244,50,.12); }
#map .ctry.sel { stroke: var(--lime); stroke-width: 1.4; }
#map .grat { fill: none; stroke: rgba(255,255,255,.05); stroke-width: .5; vector-effect: non-scaling-stroke; }
#map .pipe { fill: none; vector-effect: non-scaling-stroke; stroke-linecap: round; cursor: pointer; }
#map .pipe.flow { stroke-dasharray: 3 9; animation: dash 1.6s linear infinite; pointer-events: none; }
#map .pipe.flow.slow { stroke-dasharray: 2 16; animation-duration: 4s; }
#map .pipe.hit { pointer-events: stroke; }
.ptip { display: flex; flex-direction: column; gap: 3px; font-family: var(--body); font-size: 11px; padding: 3px 2px; }
.ptip > b { font-size: 12px; }
.ptip span { font-size: 10.5px; letter-spacing: .02em; }
.ptip .pdir { color: var(--muted); font-family: var(--mono); font-size: 9.5px; }
.tip { background: #1b1f24; border-color: #2c333b; padding: 7px 10px; }
@keyframes dash { to { stroke-dashoffset: -12; } }
#map .front { fill: none; stroke: var(--war); stroke-width: 2; vector-effect: non-scaling-stroke; stroke-dasharray: 5 3; }
#map .track { fill: none; stroke: var(--cyclone); stroke-width: 1.3; vector-effect: non-scaling-stroke; stroke-dasharray: 4 3; }
#map .orbit { fill: none; stroke: var(--sat); stroke-opacity: .5; stroke-width: 1; vector-effect: non-scaling-stroke; stroke-dasharray: 2 3; }
#map .mk { cursor: pointer; }
#map .mk text { font-family: var(--mono); paint-order: stroke; stroke: #04060a; stroke-width: 3px; }
#map .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; fill: none; }
@keyframes pulse { from { transform: scale(.4); opacity: .9; } to { transform: scale(1.8); opacity: 0; } }



/* live-build additions */
.cu-card { width: min(760px, 100%); }
.cu-title { margin: 0; font-size: 18px; line-height: 1.3; font-weight: 600; text-wrap: balance; }
.cu-sum p { margin: 5px 0 0; font-size: 13.5px; line-height: 1.6; color: #d8d9d3; }
.cu-line { display: flex; flex-direction: column; gap: 10px; border-left: 1px solid var(--line); margin-left: 4px; padding-left: 14px; }
.cu-date { font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 2px 0 4px -19px; background: #070907; padding: 1px 0; }
.cu-date::before { content: "● "; color: var(--dim); }
.cu-item { all: unset; cursor: pointer; display: grid; grid-template-columns: 8px 58px minmax(0, 1fr); column-gap: 8px; align-items: baseline; padding: 4px 4px; border-radius: 5px; width: calc(100% - 8px); }
.cu-item:hover { background: #12150e; }
.cu-item.self { background: #151a0e; outline: 1px solid #3a4a14; }
.cu-item i { width: 7px; height: 7px; border-radius: 50%; align-self: center; }
.cu-time { font-family: var(--mono); font-size: 9.5px; color: var(--dim); }
.cu-t { font-size: 12.5px; line-height: 1.4; }
.cu-n { grid-column: 3; font-family: var(--mono); font-size: 9px; color: var(--muted); }

.cal-row { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 10px; padding: 7px 0; border-bottom: 1px solid #141810; }
.cal-k { font-family: var(--mono); font-size: 8.5px; letter-spacing: .06em; text-transform: uppercase; border: 1px solid; border-radius: 3px; padding: 2px 5px; height: fit-content; text-align: center; }
.cal-t { font-size: 12.5px; line-height: 1.35; }
.nb-link { color: var(--lime); text-decoration: none; text-transform: none; letter-spacing: 0; }
.bg-thing { border-top: 1px solid #16190f; padding: 5px 0; font-size: 11.5px; }
.bg-thing summary { cursor: pointer; }
.bg-thing p { margin: 4px 0 0; color: #b8bab2; line-height: 1.45; }
.mut { color: var(--muted); }
.nb-take { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
.nb-take p { font-size: 13.5px !important; }
.nb-grid { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr) !important; }

.nb-story { padding: 8px 0 7px; border-bottom: 1px solid #141810; }

.attrib { position: absolute; right: calc(var(--rw) + 22px); bottom: 6px; z-index: 5; font-family: var(--mono); font-size: 9px; color: var(--muted); background: rgba(4,6,5,.7); padding: 2px 6px; border-radius: 4px; }

.srcbtn { width: 100%; margin-top: 10px; background: none; border: 1px solid var(--line); border-radius: 6px; font-family: var(--mono); font-size: 9.5px; color: var(--muted); padding: 5px; }
.sv-item { display: block; width: 100%; background: none; border: 0; padding: 4px 0 8px; text-align: left; border-bottom: 1px solid #16190f; }

.imgmodal { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.8); display: flex; align-items: center; justify-content: center; padding: 30px; }

.orig { font-size: 10.5px; color: var(--dim); margin: 1px 0 4px; line-height: 1.4; }
.card .srow a { color: var(--lime); text-decoration: none; }

.toast { cursor: pointer; white-space: nowrap; }

/* rich cards (chokepoints, exchanges, central banks) */
.card.rich { width: 330px; padding: 14px 14px 12px; gap: 10px; }
.card { max-height: calc(100vh - 110px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }

.mix { display: flex; align-items: center; gap: 12px; }

.rc-spark { width: 100%; height: 34px; display: block; background: #0b0e09; border-radius: 4px; }

.rc-big { font-family: var(--mono); font-size: 18px; font-weight: 700; }
.card .srow span:first-child { white-space: normal; }
.gm.fc, .gm.cbk { font-size: 8.5px; text-shadow: 0 0 3px #000, 0 0 2px #000; }
.gm.fc { color: #34d399; }
.gm.fc i { width: 6px; height: 6px; border-radius: 50%; background: #34d399; box-shadow: 0 0 5px #34d399; flex: none; }
.gm.fc.shut i { opacity: .5; box-shadow: none; }
.gm.cbk { color: #fbbf24; }
.gm.cbk i { width: 8px; height: 8px; background: #fbbf24; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); flex: none; }
.briefbox { position: fixed; top: 44px; right: 250px; z-index: 45; width: 330px; background: rgba(8,10,9,.97); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }

.briefbox .bk { font-family: var(--mono); font-size: 9px; color: var(--lime); letter-spacing: .06em; padding-top: 2px; text-transform: uppercase; }

/* morning note */
.note-wrap { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.6); display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 48px 16px; }
.note-card { position: relative; width: min(1180px, 100%); background: #070907; border: 1px solid var(--line); border-radius: 12px; padding: 18px 22px 16px; display: flex; flex-direction: column; gap: 14px; }
.n-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.n-take p { margin: 6px 0 0; font-size: 14.5px; line-height: 1.6; color: #d8d9d3; max-width: 90ch; text-wrap: pretty; }
.n-take b { color: var(--fg); font-weight: 600; }
.n-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px 26px; }
.n-grid section { min-width: 0; }
.n-board { grid-row: span 2; }
.bt { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-top: 6px; }
.bt td, .bt th { padding: 3px 6px 3px 0; border-bottom: 1px solid #141810; white-space: nowrap; }
.bt th { font-family: var(--mono); font-size: 8.5px; color: var(--dim); font-weight: 400; text-align: left; letter-spacing: .08em; text-transform: uppercase; }
.bt .num { text-align: right; font-family: var(--mono); font-size: 10.5px; font-variant-numeric: tabular-nums; }
.bt tr.gh td { font-family: var(--mono); font-size: 9px; color: var(--muted); letter-spacing: .12em; text-transform: uppercase; padding-top: 10px; border-bottom-color: #22261f; }
.bt .sp { width: 92px; padding-left: 8px; }
.bt .sp svg { width: 90px; height: 18px; display: block; }
.bt .mut, .mut { color: var(--muted); }
.bt.cal td:nth-child(3) { white-space: normal; }
.imp { font-size: 7px; color: var(--quake); letter-spacing: -1px; margin-right: 4px; }
.imp .mut { color: #2a2d27; }
.heat { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px; margin-top: 6px; }
.heat .cell { padding: 7px 7px 6px; border-radius: 3px; display: flex; flex-direction: column; gap: 2px; min-height: 36px; }
.heat .cell span { font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.heat .cell b { font-family: var(--mono); font-size: 10.5px; font-weight: 500; }
.heatkey { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 8.5px; color: var(--muted); margin-top: 4px; }
.heatkey i { flex: 0 0 90px; height: 5px; border-radius: 3px; background: linear-gradient(90deg, var(--down), #2a2d27, var(--up)); }
.lg { display: flex; gap: 12px; font-family: var(--mono); font-size: 9px; color: var(--muted); margin: 5px 0 2px; }
.lg i { display: inline-block; width: 12px; height: 2px; vertical-align: middle; margin-right: 4px; }
.curve { width: 100%; height: auto; display: block; }
.curve .ax { font-family: var(--mono); font-size: 8.5px; fill: var(--dim); }
.why { margin: 6px 0 0; padding-left: 16px; font-size: 12px; line-height: 1.55; color: #d0d1cb; }
.why a { color: var(--lime); font-family: var(--mono); font-size: 9.5px; text-decoration: none; margin-left: 4px; }
.n-src { margin: 0; font-size: 10.5px; color: var(--dim); line-height: 1.5; border-top: 1px solid var(--line); padding-top: 10px; }
.gm.ev svg { display: block; filter: drop-shadow(0 1px 3px rgba(0,0,0,.7)); }
@media (max-width: 860px) { .n-grid { grid-template-columns: 1fr; } .n-board { grid-row: auto; } .note-card { padding: 14px; } .bt .sp { display: none; } }

@media (max-width: 860px) {
  body { overflow: auto; }
  .top { position: sticky; top: 0; flex-wrap: wrap; height: auto; padding: 6px 10px; gap: 8px; }
  .stamp, .clock { display: none; }
  .stage { position: relative; inset: auto; height: 58vh; }
  .pane { position: static; width: auto !important; margin: 8px; transform: none !important; max-height: 70vh; }
  .pane.left.closed, .pane.right.closed { display: none; }
  .card { left: 10px; right: 10px !important; top: auto; bottom: 34px; width: auto; }
  .legend { display: none; }
  .briefbox { right: 10px; left: 10px; width: auto; }
  .stats { flex-wrap: wrap; justify-content: center; width: 94%; }
  .toast { max-width: 80%; }
}

/* 3.8: wrong label, markets tied to places, new-since glow, lessons, quiz, brief editions */
.btn.ghost { background: none; border-color: transparent; color: var(--dim); text-decoration: underline dotted; padding: 5px 4px; }
.btn.ghost:hover { color: var(--fg); }
.wl { border: 1px solid #3a4a14; background: #0e1209; border-radius: 7px; padding: 8px 9px; margin: 0 0 10px; }

.wl-g { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 3px 0; }
.wl-gh { font-family: var(--mono); font-size: 8.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); width: 74px; }
.wl-k { display: inline-flex; align-items: center; gap: 4px; background: #151812; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px 2px 3px; font-size: 10.5px; color: var(--fg); }
.wl-k:hover:not(:disabled) { border-color: var(--lime); }
.wl-k:disabled { opacity: .35; }
.wl-words { display: flex; flex-wrap: wrap; gap: 5px; }
.wl-w { cursor: pointer; padding: 2px 10px; background: none; }
.wl-w:hover { background: #1b2410; }
.lk { display: flex; flex-direction: column; gap: 2px; }
.lk-row { display: grid; grid-template-columns: minmax(0, 1fr) 64px 70px; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px solid #16190f; }
.lk-l { font-size: 11.5px; color: var(--fg); }
.lk-w { font-size: 10px; color: var(--muted); line-height: 1.3; }
.lk-sp { width: 64px; height: 22px; }
.lk-v { font-family: var(--mono); font-size: 10px; text-align: right; line-height: 1.35; }
.badge { display: inline-block; min-width: 14px; padding: 0 4px; margin-left: 3px; border-radius: 999px; background: var(--lime); color: #0a0a0a; font-weight: 700; font-size: 9px; text-align: center; }
.newchip { color: var(--lime); border-color: #3a4a14; background: #10150a; }
.newtag { font-family: var(--mono); font-size: 8px; color: #0a0a0a; background: var(--lime); border-radius: 3px; padding: 0 3px; letter-spacing: .06em; }
.cf.unseen .tx, .story.unseen .t { color: #eef7d8; }
.story.unseen { box-shadow: inset 2px 0 0 var(--lime); }
.gm.ev.isnew svg { border-radius: 50%; box-shadow: 0 0 0 2px #0a0a0a, 0 0 0 3.5px var(--lime), 0 0 10px 2px rgba(198,244,50,.55); }
.gm.newdot { width: 13px; height: 13px; border-radius: 50%; border: 1.6px solid var(--lime); box-shadow: 0 0 8px rgba(198,244,50,.6); }
.nb-big { border: 1px solid #3a4a14; background: #10150a; border-radius: 8px; padding: 8px 12px; margin: 10px 0 4px; }
.nb-big-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; color: var(--lime); font-size: 12.5px; }
.nb-big ul { margin: 6px 0 0; padding-left: 16px; font-size: 12.5px; line-height: 1.55; }
.nb-big a { color: var(--fg); text-decoration: none; }
.nb-big a:hover { text-decoration: underline; }
.ls-card { width: min(760px, 100%); }
.ls-from { font-size: 11.5px; color: var(--muted); margin: 4px 0 6px; }
.ls-sec { margin-top: 12px; }
.ls-sec p { margin: 4px 0 0; font-size: 13.5px; line-height: 1.6; color: #d8d9d3; }
.ls-dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 14px; margin: 5px 0 0; font-size: 13px; line-height: 1.5; }

.ls-dl dd { margin: 0; color: #d8d9d3; }
.ls-q { font-size: 13px; margin: 6px 0; }
.ls-a { all: unset; cursor: pointer; font-family: var(--mono); font-size: 10px; color: var(--muted); text-decoration: underline dotted; margin-top: 2px; }
.ls-ans { color: var(--lime); margin-top: 3px; font-size: 12.5px; }
.qz-card { width: min(620px, 100%); }
.qz-lead { font-size: 13px; color: #d8d9d3; line-height: 1.55; }
.qz-bar { height: 3px; background: #1a1d16; border-radius: 3px; margin: 2px 0 10px; }
.qz-bar span { display: block; height: 100%; background: var(--lime); border-radius: 3px; }
.qz-opts { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
.qz-o { display: flex; gap: 10px; align-items: center; text-align: left; background: #12150e; border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px; font-size: 13px; color: var(--fg); }
.qz-o:hover:not(:disabled) { border-color: var(--lime); }

.qz-why { font-size: 13px; line-height: 1.55; margin: 12px 0 8px; color: #d8d9d3; }
.qz-score { font-family: var(--mono); font-size: 44px; font-weight: 700; text-align: center; color: var(--lime); margin: 14px 0 4px; }

.qz-dots { display: flex; align-items: flex-end; gap: 4px; height: 38px; }
.qz-dots span { width: 10px; border-radius: 2px 2px 0 0; }

/* 3.11: the solar system view (an orrery in line drawing) */
#solar { position: absolute; inset: 0; background: var(--o-bg); }
.stage.solarmode .stats, .stage.solarmode .legend, .stage.solarmode .timebar { display: none; }
.orrery { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; }
.orr-base { fill: var(--o-base); stroke: var(--o-baseEdge); stroke-width: 1.2; }
.orr-base.top { fill: var(--o-base); }
.orr-skirt { fill: var(--o-base); stroke: var(--o-baseEdge); stroke-width: .8; stroke-opacity: .7; }
.orr-inlay { fill: none; stroke: var(--o-baseEdge); stroke-opacity: .45; stroke-width: 1; stroke-dasharray: 2 4; }
.orr-post { stroke: var(--o-post); stroke-width: 3.2; stroke-linecap: round; }
.orr-column { stroke: var(--o-line); stroke-width: 3.6; stroke-linecap: round; }
.orr-gear { fill: var(--o-base); stroke: var(--o-post); stroke-width: 1; }
.orr-ring-band { fill: var(--o-ring); stroke: var(--o-ringEdge); stroke-width: 1.1; }
.orr-ring-band.front { opacity: .8; }
.orr-tick { stroke: var(--o-tick); stroke-width: .8; }
.orr-mon { font: 8.5px var(--mono); fill: var(--o-sub); letter-spacing: .06em; pointer-events: none; }
.orr-zod { font: 11px "Segoe UI Symbol", "DejaVu Sans", sans-serif; fill: var(--o-text); pointer-events: none; }
.orr-orbit { fill: none; stroke: var(--o-orbit); stroke-opacity: var(--o-orbitOp); stroke-width: 1.1; }
.orr-orbit.dwarf { stroke-dasharray: 3 3; }
.orr-arm { stroke: var(--o-line); stroke-width: 1.5; }
.orr-rod { stroke: var(--o-line); stroke-width: 1.3; }
.orr-ray { stroke: var(--o-accent); stroke-width: 1.4; stroke-linecap: round; opacity: .85; }
.orr-drop { stroke: var(--o-craft); stroke-opacity: .35; stroke-width: .8; stroke-dasharray: 2 3; }
.orr-body { stroke: var(--o-halo); stroke-width: 1.2; }
.orr-moonarm { stroke: var(--o-line); stroke-width: .7; }
.orr-moon { fill: #d8d4c6; stroke: var(--o-halo); stroke-width: .5; }
.orr-lab { font: 600 10px var(--o-font); fill: var(--o-text); paint-order: stroke; stroke: var(--o-halo); stroke-width: 3px; pointer-events: none; letter-spacing: .04em; }
.orr-lab2 { font: 8.5px var(--mono); fill: var(--o-sub); paint-order: stroke; stroke: var(--o-halo); stroke-width: 3px; pointer-events: none; }
.orr-pl.sel .orr-lab, .orr-sc.sel .orr-sclab { fill: var(--o-accent); }
.orr-sc rect:first-child { fill: var(--o-craft); stroke: var(--o-halo); stroke-width: 1; }
.orr-sclab { font: 9px var(--mono); fill: var(--o-text); opacity: .85; paint-order: stroke; stroke: var(--o-halo); stroke-width: 3px; pointer-events: none; }
.orr-selring { fill: none; stroke: var(--o-accent); stroke-width: 1.4; stroke-dasharray: 3 2; }
.orr-plate { font: 9px var(--o-font); fill: var(--o-sub); letter-spacing: .18em; }
#solar[data-theme="harmonia"] .orr-note { color: #5a4a2e; }
.orr-row { display: flex; gap: 6px; }
.orr-row button { flex: none; background: rgba(8,10,6,.9); border: 1px solid #3a4a14; border-radius: 7px; color: var(--fg); font-family: var(--mono); font-size: 10.5px; padding: 0 10px; }

.gv-legend div { display: flex; align-items: center; gap: 7px; margin: 3px 0; } .gv-legend i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.gv-tip { position: fixed; z-index: 45; pointer-events: none; background: rgba(8,10,8,.97); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; display: grid; grid-template-columns: 36px 1fr; column-gap: 8px; align-items: center; max-width: 320px; }
.gv-tip[hidden] { display: none; }
.gv-tip .gv-flag { grid-row: span 3; } .gv-tip b { font-size: 12.5px; } .gv-tip span { font-family: var(--mono); font-size: 9.5px; color: var(--muted); } .gv-tip i { font-style: normal; font-size: 11px; }
</style>

<header class="top">
  <span class="brand">ARCHIE <b>WORLD</b></span>
  <span class="stamp" id="stamp">loading…</span>
  <button class="tbtn newchip" id="t-new" hidden></button>
  <span class="spacer"></span>
  <input class="ask" id="ask" placeholder="ask the map… (what's happening near Hormuz?)" autocomplete="off">
  <button class="tbtn" id="t-left" aria-pressed="true">layers</button>

  <div class="seg" role="group" aria-label="View">
    <button id="v-globe" aria-pressed="true">3D globe</button>

    <button id="v-solar" aria-pressed="false">solar system</button>
  </div>
  <button class="tbtn" id="t-cal">calendar</button>
  <button class="tbtn" id="t-quiz" title="a quick quiz on this week's news">quiz</button>

  <button class="tbtn" id="t-note" style="color:var(--lime);border-color:#3a4a14">morning note</button>
  <button class="tbtn" id="t-right" aria-pressed="true">feed</button>

  <span class="clock" id="clock"></span>
</header>

<main class="stage" id="stage">
  <div id="globe"></div>
  <svg id="map" hidden></svg>
  <div id="solar" hidden></div>
  <div class="stats" id="stats"></div>
  <div class="legend" id="legend"></div>
  <div class="toast" id="toast" hidden></div>
  <div class="attrib" id="attrib" hidden>map © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors</div>
  <div class="timebar"><button id="tplay" title="play the last 3 days">▶</button><input type="range" id="trange" min="-72" max="0" step="0.5" value="0" aria-label="time"><span id="tlabel">live</span><button id="tlive">now</button></div>
</main>

<aside class="pane left" id="pane-left" aria-label="Layers">
  <div class="ph"><span class="h">Layers</span></div>
  <div class="pb">
    <div id="layers"></div>
    <div class="grp-h">Regions</div>
    <div class="chips" id="regions"></div>
    <div class="grp-h">Watching · alerts</div>
    <div id="watch"></div>
    <p class="note">Drag to spin, scroll to zoom. Click a country for facts and its latest articles, or click anything on the map.</p>
    <button class="srcbtn" id="sources-btn">sources &amp; how trustworthy they've been</button>
  </div>
</aside>

<aside class="pane right" id="pane-right" aria-label="Feed">

      <button role="tab" class="warTab" id="tab-war" aria-selected="true">CONFLICT<span class="ct" id="ct-war"></span></button>
      <button role="tab" id="tab-news" aria-selected="false">NEWS<span class="ct" id="ct-news"></span></button>
      <button role="tab" id="tab-mk" aria-selected="false">MARKETS</button>
      <button role="tab" id="tab-saved" aria-selected="false">SAVED</button>
    </div>
    <div class="pb" id="p-war"></div>
    <div class="pb" id="p-news" hidden></div>
    <div class="pb" id="p-mk" hidden></div>
    <div class="pb" id="p-saved" hidden></div>
  </div>
  <div id="countryview" hidden style="display:flex;flex-direction:column;min-height:0;flex:1"></div>
</aside>

<div class="card" id="card" hidden>
  <button class="x" id="card-x" aria-label="Close">×</button>

<div class="answer" id="answer" hidden></div>
<div class="imgmodal" id="imgmodal" hidden><img id="imgmodal-img" alt="saved headline"></div>
