<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Archie Workshop</title>
<style>
@font-face { font-family: "Geist"; src: url(/fonts/Geist-Regular.ttf); font-weight: 400; }
@font-face { font-family: "Geist"; src: url(/fonts/Geist-SemiBold.ttf); font-weight: 500 600; }
@font-face { font-family: "Geist"; src: url(/fonts/Geist-Bold.ttf); font-weight: 700 800; }
@font-face { font-family: "JetBrains Mono"; src: url(/fonts/JetBrainsMono-Regular.ttf); font-weight: 400 500; }
@font-face { font-family: "JetBrains Mono"; src: url(/fonts/JetBrainsMono-Bold.ttf); font-weight: 700; }
/* Archie's Workshop: one deliberate look, Archie's black and lime, like the rest of Archie. */
:root { --bg: #050605; --panel: #0b0d0a; --panel2: #10130e; --line: #22261f; --fg: #e8e8e3; --muted: #8f918a; --dim: #5d6157;
  --lime: #c6f432; --blue: #7ec8ff; --amber: #ffc85a; --red: #ff8a7a; --green: #8fe39a;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; --body: "Geist", system-ui, sans-serif; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 13px; display: flex; flex-direction: column; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--lime); outline-offset: 2px; }
a { color: var(--lime); }
.top { height: 42px; display: flex; align-items: center; gap: 14px; padding: 0 14px; border-bottom: 1px solid var(--line); background: #030403; flex-shrink: 0; }
.top b { font-family: var(--mono); letter-spacing: .14em; font-size: 12px; } .top b span { color: var(--lime); }
.chip { font-family: var(--mono); font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 20px; padding: 2px 9px; white-space: nowrap; }
.chip.ok { color: var(--lime); border-color: #3c4d12; }
.grow { flex: 1; }
.main { flex: 1; display: grid; grid-template-columns: 250px minmax(0, 1fr) 390px; min-height: 0; }
.left { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.lh { font-family: var(--mono); font-size: 9px; letter-spacing: .14em; color: var(--muted); padding: 12px 14px 8px; }
.btn { background: none; border: 1px solid #2b3125; border-radius: 6px; padding: 6px 11px; cursor: pointer; font-family: var(--mono); font-size: 11px; color: var(--fg); min-height: 32px; }
.btn:hover { border-color: var(--lime); color: var(--lime); }
.btn.go { background: var(--lime); color: #0a0c06; border-color: var(--lime); font-weight: 700; }
.btn.go:hover { background: #d8ff5c; color: #0a0c06; }
.btn:disabled { opacity: .45; cursor: default; }
.plist { overflow-y: auto; flex: 1; padding: 0 8px 12px; }
.proj { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 2px; width: 100%; padding: 9px 10px; border-radius: 6px; border: 1px solid transparent; }
.proj:hover { background: var(--panel); } .proj.on { background: var(--panel2); border-color: #3c4d12; }
.proj b { font-size: 13px; } .proj span { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.bar { height: 3px; background: #1a1e16; border-radius: 2px; margin-top: 4px; overflow: hidden; } .bar i { display: block; height: 100%; background: var(--lime); }
.center { overflow-y: auto; padding: 18px 22px 40px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.ph { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.ph h1 { margin: 0; font-size: 22px; } .ph .sub { font-family: var(--mono); font-size: 10.5px; color: var(--muted); margin-top: 3px; word-break: break-all; }
.acts { display: flex; gap: 6px; flex-wrap: wrap; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.kick { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; color: var(--lime); }
.card h2 { margin: 0; font-size: 18px; } .card p { margin: 0; line-height: 1.6; font-size: 13.5px; }
.task { border: 1px dashed #4a5a18; border-radius: 8px; padding: 10px 12px; background: #0e120a; line-height: 1.55; }
.task b, .done-when b { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; color: var(--lime); display: block; margin-bottom: 3px; }
.done-when { font-size: 12.5px; color: #c8cbc0; } .done-when b { color: var(--muted); }
.steps { display: flex; gap: 4px; flex-wrap: wrap; } .steps i { width: 26px; height: 6px; border-radius: 3px; background: #22271d; } .steps i.d { background: var(--lime); } .steps i.c { background: #6d8a1c; }
textarea, input[type=text], select { background: #070807; border: 1px solid #2b3125; border-radius: 6px; padding: 8px 10px; width: 100%; }
textarea { resize: vertical; min-height: 70px; line-height: 1.5; }
label { font-family: var(--mono); font-size: 10px; color: var(--muted); display: block; margin-bottom: 4px; }
.row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; } .row > div { flex: 1; min-width: 160px; }
.seg { display: flex; border: 1px solid #2b3125; border-radius: 8px; overflow: hidden; }
.seg button { all: unset; cursor: pointer; flex: 1; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.seg button b { font-size: 13px; } .seg button span { font-size: 11.5px; color: var(--muted); }
.seg button.on { background: #141b0b; box-shadow: inset 0 -2px 0 var(--lime); }
.files { display: flex; flex-direction: column; }
.file { all: unset; cursor: pointer; display: flex; justify-content: space-between; padding: 5px 6px; font-family: var(--mono); font-size: 11.5px; border-bottom: 1px solid #14170f; }
.file:hover { color: var(--lime); } .file span { color: var(--dim); }
pre.code { margin: 0; background: #070807; border: 1px solid var(--line); border-radius: 8px; padding: 10px 0; font-family: var(--mono); font-size: 12px; line-height: 1.55; overflow: auto; max-height: 460px; }
pre.code .ln { display: inline-block; width: 44px; text-align: right; padding-right: 12px; color: var(--dim); user-select: none; }
pre.code .hl { background: #2a1512; display: block; }
pre.out { margin: 0; background: #070807; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-family: var(--mono); font-size: 11.5px; line-height: 1.5; white-space: pre-wrap; max-height: 260px; overflow: auto; }
pre.out.err { border-color: #5a2a22; color: #ffd4cc; }
.diff { white-space: pre; } .diff .a { color: var(--green); } .diff .r { color: var(--red); } .diff .h { color: var(--blue); }
.preview { width: 100%; height: 520px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
.right { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
.ctx { padding: 9px 14px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.ctx b { color: var(--fg); font-weight: 500; }
.feed { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.ev { border-left: 2px solid var(--line); padding: 4px 0 4px 10px; }
.ev .t { font-size: 12.5px; font-weight: 600; } .ev .w { font-family: var(--mono); font-size: 9.5px; color: var(--dim); margin-left: 6px; font-weight: 400; }
.ev .x { font-size: 12.5px; line-height: 1.55; color: #c8cbc0; margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
.ev .x pre { white-space: pre-wrap; font-family: var(--mono); font-size: 11px; background: #070807; border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin: 6px 0; }
.ev.pass { border-color: var(--lime); } .ev.tryagain, .ev.syntax, .ev.error { border-color: var(--red); } .ev.explain, .ev.hint, .ev.show { border-color: var(--blue); }
.ev.change { border-color: var(--amber); } .ev.run { border-color: #3a4030; } .ev.done { border-color: var(--lime); } .ev.work .t::after { content: " …"; }
.ask { border-top: 1px solid var(--line); padding: 10px 12px; display: flex; gap: 8px; }
.ask textarea { min-height: 40px; height: 40px; }
.empty { color: var(--muted); line-height: 1.6; max-width: 620px; }
.empty h2 { color: var(--fg); margin: 30px 0 8px; }
.busy { display: inline-flex; align-items: center; gap: 8px; color: var(--lime); font-family: var(--mono); font-size: 11px; }
.busy i { width: 10px; height: 10px; border: 2px solid var(--lime); border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
details summary { cursor: pointer; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.note { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 10px; }
.bk { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 12px 13px; display: flex; flex-direction: column; gap: 6px; }
.bk h3 { margin: 0; font-size: 14px; } .bk p { margin: 0; font-size: 12.5px; line-height: 1.5; color: #c8cbc0; }
.bk .meta { font-family: var(--mono); font-size: 9.5px; color: var(--muted); letter-spacing: .06em; }
.bk .tags { display: flex; gap: 4px; flex-wrap: wrap; } .bk .tags i { font-style: normal; font-family: var(--mono); font-size: 9.5px; color: var(--dim); border: 1px solid var(--line); border-radius: 10px; padding: 1px 7px; }
.bk.recipe { border-color: #3c4d12; } .bk .acts .btn { min-height: 28px; padding: 4px 9px; font-size: 10.5px; }
.guide table { border-collapse: collapse; width: 100%; font-size: 12.5px; } .guide td, .guide th { border-bottom: 1px solid var(--line); padding: 5px 8px; text-align: left; vertical-align: top; }
.guide th { font-family: var(--mono); font-size: 9.5px; color: var(--muted); letter-spacing: .1em; font-weight: 400; }
.gfile { all: unset; cursor: pointer; display: block; padding: 7px 0; border-bottom: 1px solid #14170f; } .gfile b { font-family: var(--mono); font-size: 12px; color: var(--lime); } .gfile span { display: block; font-size: 12.5px; color: #c8cbc0; line-height: 1.5; margin-top: 2px; }
pre.code .note-row { display: block; background: #0e1a24; color: #bfe0ff; font-family: var(--body); font-size: 12.5px; line-height: 1.5; padding: 6px 12px 6px 56px; white-space: pre-wrap; border-left: 2px solid var(--blue); }
pre.code .hl2 { background: #102030; display: block; }
.kind { font-family: var(--mono); font-size: 9px; letter-spacing: .12em; padding: 1px 6px; border-radius: 4px; background: #182010; color: var(--lime); }
.kind.feature { background: #10202b; color: var(--blue); } .kind.hardware { background: #2b2210; color: var(--amber); } .kind.game { background: #2b1414; color: var(--red); } .kind.toolkit { background: #1a1a1a; color: var(--muted); }
.nav { display: flex; gap: 6px; padding: 0 14px 10px; } .nav .btn { flex: 1; } .nav .btn.on { border-color: var(--lime); color: var(--lime); }
.blist { display: flex; flex-direction: column; gap: 4px; } .blist div { display: flex; justify-content: space-between; gap: 8px; font-family: var(--mono); font-size: 11px; padding: 4px 0; border-bottom: 1px solid #14170f; }
.upd { border: 1px solid #5a4a12; background: #15120a; border-radius: 8px; padding: 10px; font-size: 12.5px; line-height: 1.5; }
.checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 2px 10px; font-family: var(--mono); font-size: 11px; }
.checks label { display: flex; gap: 6px; align-items: center; color: var(--fg); font-size: 11px; margin: 0; }
.units { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; }
.unit { all: unset; box-sizing: border-box; cursor: pointer; border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 4px; background: var(--panel); }
.unit:hover { border-color: var(--lime); } .unit.locked { opacity: .45; cursor: default; } .unit.locked:hover { border-color: var(--line); }
.unit.mastered { border-color: #3c4d12; } .unit b { font-size: 12.5px; } .unit span { font-family: var(--mono); font-size: 9.5px; color: var(--muted); }
.skill { display: grid; grid-template-columns: 130px 1fr 38px; gap: 8px; align-items: center; font-family: var(--mono); font-size: 10.5px; }
.skill .bar { height: 6px; margin: 0; }
.lesson { font-size: 14px; line-height: 1.7; max-width: 760px; } .lesson p { margin: 0 0 10px; } .lesson code { font-family: var(--mono); font-size: 12.5px; background: #12160e; padding: 1px 5px; border-radius: 4px; color: var(--lime); }
.lesson pre { background: #070807; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font-family: var(--mono); font-size: 12.5px; overflow: auto; }
.lesson ul { margin: 0 0 10px; padding-left: 20px; }
.ex { border: 1px solid var(--line); border-radius: 9px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.ex.ok { border-color: #3c4d12; } .ex h3 { margin: 0; font-size: 14px; } .ex .p { white-space: pre-wrap; line-height: 1.55; font-size: 13px; }
.quiz .q { margin: 10px 0 4px; font-weight: 600; white-space: pre-wrap; } .quiz label { display: flex; gap: 8px; align-items: center; color: var(--fg); font-family: var(--body); font-size: 13px; margin: 3px 0; cursor: pointer; }
.quiz .why { font-size: 12px; color: var(--muted); margin-left: 24px; } .quiz .r-ok { color: var(--lime); } .quiz .r-no { color: var(--red); }
.refs { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin-top: 6px; font-family: var(--mono); font-size: 9.5px; color: var(--dim); letter-spacing: .06em; }
.ref { all: unset; cursor: pointer; font-family: var(--body); font-size: 11.5px; letter-spacing: 0; color: var(--blue); border: 1px solid #1d3346; border-radius: 12px; padding: 2px 9px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ref:hover, .ref:focus-visible { border-color: var(--blue); background: #0c1720; }
.ref i { font-style: normal; color: var(--muted); }
#docpane { position: fixed; top: 42px; right: 0; bottom: 0; width: min(620px, 100vw); background: #070907; border-left: 1px solid #2b3125; box-shadow: -18px 0 40px rgba(0,0,0,.55); display: flex; flex-direction: column; z-index: 20; }
#docpane[hidden] { display: none; }
.dp-h { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.dp-h b { font-family: var(--mono); font-size: 11px; letter-spacing: .14em; } .dp-h b span { color: var(--blue); }
.dp-h label { display: flex; align-items: center; gap: 6px; margin: 0; font-size: 10.5px; color: var(--fg); cursor: pointer; } .dp-h input { width: auto; }
#dp-f { display: flex; gap: 6px; padding: 10px 14px; border-bottom: 1px solid var(--line); } #dp-f select { width: 120px; flex-shrink: 0; }
#dp-body { flex: 1; overflow-y: auto; padding: 14px 18px 40px; font-size: 13.5px; line-height: 1.65; }
#dp-body h3 { font-size: 15px; margin: 18px 0 6px; color: var(--fg); } #dp-body h2.pt { font-size: 20px; margin: 0 0 2px; }
#dp-body p { margin: 0 0 9px; color: #d6d8cf; } #dp-body .li { margin: 0 0 5px; padding-left: 14px; position: relative; color: #d6d8cf; } #dp-body .li::before { content: "•"; position: absolute; left: 0; color: var(--dim); }
#dp-body pre { background: #0b0d0a; border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px; font-family: var(--mono); font-size: 12px; line-height: 1.5; overflow: auto; margin: 4px 0 12px; }
#dp-body .dt { font-family: var(--mono); font-size: 12px; color: var(--lime); margin: 12px 0 3px; }
.dp-src { font-family: var(--mono); font-size: 10px; color: var(--blue); letter-spacing: .08em; }
.dp-res { all: unset; box-sizing: border-box; cursor: pointer; display: block; width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; }
.dp-res:hover, .dp-res:focus-visible { border-color: var(--blue); } .dp-res b { display: block; font-size: 13.5px; margin: 2px 0 3px; } .dp-res span { font-size: 12px; color: var(--muted); line-height: 1.5; }
.dp-warn { border: 1px solid #5a4a12; background: #15120a; border-radius: 8px; padding: 10px 12px; font-size: 12.5px; line-height: 1.55; margin-bottom: 12px; }
.dp-langs { display: grid; grid-template-columns: 90px 1fr; gap: 4px 10px; font-size: 12px; } .dp-langs b { font-family: var(--mono); font-size: 11px; } .dp-langs span { color: var(--muted); }
.coach { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; align-items: start; }
@media (max-width: 1300px) { .coach { grid-template-columns: 1fr; } }
.cmsg { display: flex; flex-direction: column; gap: 10px; }
.you { align-self: flex-end; max-width: 85%; background: #141b0b; border: 1px solid #3c4d12; border-radius: 10px 10px 2px 10px; padding: 9px 12px; white-space: pre-wrap; line-height: 1.55; }
.you .w, .cr .w { display: block; font-family: var(--mono); font-size: 9.5px; color: var(--dim); margin-top: 4px; }
.cr { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.cr h4 { margin: 0 0 3px; font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; color: var(--lime); font-weight: 400; }
.cr p, .cr li, .cr .x { margin: 0; line-height: 1.6; font-size: 13.5px; color: #d6d8cf; white-space: pre-wrap; }
.cr ol { margin: 0; padding-left: 20px; } .cr li { margin-bottom: 3px; white-space: normal; }
.cr .x pre { white-space: pre-wrap; font-family: var(--mono); font-size: 12px; background: #070807; border: 1px solid var(--line); border-radius: 6px; padding: 8px; margin: 6px 0; }
.cr .exp { border: 1px dashed #4a5a18; border-radius: 8px; padding: 9px 11px; background: #0e120a; }
.cr .concept { border-left: 2px solid var(--blue); padding-left: 10px; } .cr .concept h4 { color: var(--blue); }
.cr .rem { font-family: var(--mono); font-size: 10px; color: var(--muted); }
.mem h3 { font-family: var(--mono); font-size: 9.5px; letter-spacing: .14em; color: var(--lime); font-weight: 400; margin: 10px 0 4px; }
.mem .it { display: flex; gap: 6px; align-items: flex-start; font-size: 12.5px; line-height: 1.45; padding: 4px 0; border-bottom: 1px solid #14170f; }
.mem .it span { flex: 1; } .mem .it i { font-style: normal; font-family: var(--mono); font-size: 9px; color: var(--dim); }
.mem .it button { all: unset; cursor: pointer; color: var(--dim); padding: 0 4px; font-size: 14px; line-height: 1; } .mem .it button:hover, .mem .it button:focus-visible { color: var(--red); }
.mem form { display: flex; gap: 4px; margin-top: 4px; } .mem form input { padding: 5px 8px; font-size: 12px; } .mem form .btn { min-height: 28px; padding: 3px 8px; }
.gcard { all: unset; box-sizing: border-box; cursor: pointer; display: flex; flex-direction: column; gap: 4px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); }
.gcard:hover, .gcard:focus-visible { border-color: var(--lime); } .gcard b { font-size: 15px; } .gcard span { font-size: 12px; color: var(--muted); line-height: 1.5; }
@media (max-width: 1100px) { .main { grid-template-columns: 210px minmax(0, 1fr); } .right { display: none; } }
</style>
</head>
<body>
<div class="top"><b>ARCHIE <span>WORKSHOP</span></b><span class="chip" id="model">model…</span><span id="rts"></span><span class="grow"></span><button class="chip" id="docs" style="cursor:pointer;background:none" title="the offline docs and Q&amp;A Archie looks things up in">docs…</button><span class="chip" id="codium">VSCodium…</span></div>
<div class="main">
  <div class="left">
    <div class="lh">PROJECTS</div>
    <div style="padding: 0 14px 8px"><button class="btn go" id="newbtn" style="width: 100%">+ new project</button></div>
    <div class="nav"><button class="btn" id="libbtn" title="tested building blocks and whole apps to start from">library</button><button class="btn" id="crsbtn" title="courses, Harvard / MIT style">courses</button></div>
    <div class="nav" style="padding-top:0"><button class="btn" id="coachbtn" title="a dev log and coach for each game you're making, in any engine">dev coach</button></div>
    <div class="plist" id="plist"></div>
    <div class="note" style="padding: 10px 14px; border-top: 1px solid var(--line)"><span id="where"></span><br><a href="#" id="trashlink">trash</a></div>
  </div>
  <div class="center" id="center"></div>
  <div class="right">
    <div class="ctx" id="ctx">VSCodium: the Archie Coach add-on shows where you are here.</div>
    <div class="feed" id="feed" aria-live="polite"></div>
    <form class="ask" id="askf"><label for="askq" style="position:absolute;left:-9999px">Ask Archie</label><textarea id="askq" placeholder="ask Archie about this project…"></textarea><button class="btn go" type="submit">ask</button></form>
  </div>
</div>
<aside id="docpane" hidden aria-label="Offline docs">

<script>

var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function api(path, body) {

}
function job(r, label, after) {    // long work runs in the background; the feed shows it as it goes

}
function ago(ts) { var m = Math.round((Date.now() / 1000 - ts) / 60); return m < 1 ? "now" : m < 60 ? m + "m" : m < 1440 ? Math.round(m / 60) + "h" : Math.round(m / 1440) + "d"; }

}

function boot() {

      ga.textContent = "get Arduino board support"; ga.onclick = function () { ga.textContent = "getting it (a few minutes)…"; api("get_arduino_core", {}).then(function (r) { job(r, "ard", function (res) { if (res.ok) ga.remove(); else { ga.textContent = "get Arduino board support"; alert(res.error || "It didn't install. Is there internet?"); } }); }); };
      $("codium").parentNode.insertBefore(ga, $("codium")); }
    if (s.arduino_core && $("getard")) $("getard").remove();

function editing() {      // don't redraw the page under someone who is typing or using a panel

}
var KEEP = {};
function drawList() {

}
function pick(n) { MODE = "project"; navOn(); CU.unit = ""; CUR = n; P = null; VIEW = { file: "", hl: null }; LASTRUN = null; SINCE = 0; $("feed").innerHTML = ""; try { localStorage.setItem("archieWorkshop", n); } catch (e) { } drawList(); refresh(); }

/* ---------------- new project */
$("newbtn").onclick = function () { MODE = "project"; navOn(); CUR = ""; drawList(); newForm(); };
function navOn() { $("libbtn").classList.toggle("on", MODE === "library"); $("crsbtn").classList.toggle("on", MODE === "courses"); $("coachbtn").classList.toggle("on", MODE === "coach"); }

/* ---------------- trash: deleted projects and blocks wait here until you empty it */

    var em = $("t-empty"); if (em) em.onclick = function () { if (confirm("Delete everything in the trash for good? This can't be undone.")) api("empty_trash", {}).then(trashView); };

/* ---------------- the library: tested blocks and whole apps (recipes) */
function tags(t) { return '<div class="tags">' + (t || []).slice(0, 6).map(function (x) { return "<i>" + esc(x) + "</i>"; }).join("") + "</div>"; }
function recipeCard(r) {

function wireRecipes(el) {

  }; });

function blockCard(c) {

function library() {

function md(t) {     // the lessons' light markdown: paragraphs, **bold**, `code`, ``` blocks, - lists
  var out = [], blocks = String(t || "").split(/```\n?/);
  blocks.forEach(function (b, i) {
    if (i % 2) { out.push("<pre>" + esc(b.replace(/\n$/, "")) + "</pre>"); return; }
    b.split(/\n{2,}/).forEach(function (para) {
      if (!para.trim()) return;
      var inline = function (x) { return esc(x).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>"); };
      var L = para.split("\n");
      if (L.every(function (l) { return /^\s*-\s/.test(l) || !l.trim(); })) out.push("<ul>" + L.filter(function (l) { return l.trim(); }).map(function (l) { return "<li>" + inline(l.replace(/^\s*-\s/, "")) + "</li>"; }).join("") + "</ul>");
      else if (/^\d+\. /.test(L[0])) out.push("<ol>" + L.map(function (l) { return "<li>" + inline(l.replace(/^\d+\.\s*/, "")) + "</li>"; }).join("") + "</ol>");
      else out.push("<p>" + L.map(inline).join("<br>") + "</p>");
    });
  });
  return out.join("");
}

  var d = DOCS || {}, b = $("dp-body"), h = "";
  if (d.libzim === false) h += '<div class="dp-warn">Searching the docs needs one extra piece. Double-click <b>Install Extras.bat</b> in the Archie folder, then restart Archie.</div>';
  if (d.unfinished && d.unfinished.length) h += '<div class="dp-warn"><b>' + d.unfinished.length + " files didn't finish downloading:</b> " + esc(d.unfinished.map(function (n) { return n.replace(/^devdocs_en_|_\d{4}-\d{2}$/g, "").replace(/_\d{4}-\d{2}$/, ""); }).join(", ")) +
    ". Run <b>Get Vault.bat</b> again (in the Vault folder) and it picks up where it stopped. Until then Archie leaves those out.</div>";
  h += '<p class="note" style="margin-bottom:12px">Before Archie answers, hints or checks your work, it searches these on this PC and shows the pages it used under its answer. Click one to read it here. Nothing goes online.</p><div class="dp-langs">';
  Object.keys(d.langs || {}).forEach(function (k) { var L = d.langs[k]; h += "<b>" + esc(k) + "</b><span>" + (L.have.length ? esc(L.have.join(", ")) : "nothing yet") + "</span>"; });
  b.innerHTML = h + "</div>" + (d.folder ? '<p class="note" style="margin-top:14px">From ' + esc(d.folder) + "</p>" : "");
}
function openDoc(zim, path, at) {
  openPane();
  var b = $("dp-body"); b.innerHTML = '<span class="busy"><i></i> opening…</span>';
  api("docpage?zim=" + encodeURIComponent(zim) + "&path=" + encodeURIComponent(path)).then(function (d) {
    if (d.error) { b.innerHTML = '<p>' + esc(d.error) + "</p>"; return; }
    var h = '<button class="btn" id="dp-back" style="margin-bottom:10px">‹ docs home</button><div class="dp-src">' + esc(d.src).toUpperCase() + (d.tags && d.tags.length ? " · " + esc(d.tags.join(", ")) : "") + '</div><h2 class="pt">' + esc(d.title) + "</h2>";
    (d.blocks || []).forEach(function (x) {
      var k = x[0], t = x[1];
      if (k === "h1" && t === d.title) return;
      h += k === "code" ? "<pre>" + esc(t) + "</pre>" : /^h/.test(k) ? "<h3>" + esc(t) + "</h3>" : k === "li" ? '<div class="li">' + esc(t) + "</div>" : k === "dt" ? '<div class="dt">' + esc(t) + "</div>" : "<p>" + esc(t) + "</p>";
    });
    b.innerHTML = h; b.scrollTop = 0;
    $("dp-back").onclick = paneHome;
    if (at) {     // jump to the part Archie used, and mark it
      var hit = Array.prototype.find.call(b.querySelectorAll("h3, .dt"), function (x) { return x.textContent.trim() === at.trim(); });
      if (hit) { hit.style.color = "var(--blue)"; hit.style.borderLeft = "2px solid var(--blue)"; hit.style.paddingLeft = "8px"; b.scrollTop = hit.getBoundingClientRect().top - b.getBoundingClientRect().top + b.scrollTop - 16; }
    }
  });
}
$("docs").onclick = function () { if (!DOCS) docsStatus(); openPane(); };
$("dp-x").onclick = function () { $("docpane").hidden = true; };
$("dp-on").onchange = function () { api("docs_on", { on: $("dp-on").checked }).then(function () { docsStatus(); }); };
$("dp-lang").onchange = function () { DOCLANG = $("dp-lang").value; };
$("dp-f").onsubmit = function (e) {
  e.preventDefault(); var q = $("dp-q").value.trim(); if (!q) return;
  var b = $("dp-body"); b.innerHTML = '<span class="busy"><i></i> searching…</span>';
  api("docs?lang=" + encodeURIComponent($("dp-lang").value) + "&q=" + encodeURIComponent(q)).then(function (d) {
    var R = d.results || [];
    b.innerHTML = R.length ? R.map(function (r) { return '<button class="dp-res" data-z="' + esc(r.zim) + '" data-p="' + esc(r.path) + '" data-a="' + esc(r.at || "") + '"><span class="dp-src">' + esc(r.src).toUpperCase() + "</span><b>" + esc(r.title) + "</b><span>" + esc(r.snippet) + "</span></button>"; }).join("")
      : "<p>Nothing found for that in the " + esc($("dp-lang").value) + " docs. Try the name of a function or the exact error message.</p>";
    b.querySelectorAll(".dp-res").forEach(function (x) { x.onclick = function () { openDoc(x.dataset.z, x.dataset.p, x.dataset.a); }; });
  });
};
document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !$("docpane").hidden) $("docpane").hidden = true; });
boot();
</script>
</body>
</html>
